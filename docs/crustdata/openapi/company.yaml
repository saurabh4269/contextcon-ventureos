        "400":
          headers:
            X-Credits-Used:
              $ref: "#/components/headers/XCreditsUsed"
          description: Invalid search request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                malformed_cursor:
                  value:
                    error:
                      type: invalid_request
                      message: "Invalid cursor: expired or malformed; restart without cursor"
                      metadata: []
                changed_query:
                  value:
                    error:
                      type: invalid_request
                      message: "Invalid cursor: query, mode, filters and API version must remain unchanged"
                      metadata: []
                invalid_field:
                  summary: Unsupported filter field
                  value:
                    error:
                      type: invalid_request
                      message: "Unsupported columns in conditions: ['invalid_field']"
                      metadata: []
                missing_sort_field:
                  summary: sorts entry missing the required `field` key
                  value:
                    error:
                      type: invalid_request
                      message: "Missing required field: 'sorts.0.field'."
                      metadata:
                        - field: sorts.0.field
                          type: missing
                          message: "Missing required field: 'sorts.0.field'."
        "401":
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  type: unauthorized
                  message: Invalid API key in request.
                  metadata: []
        "403":
          headers:
            X-Credits-Used:
              $ref: "#/components/headers/XCreditsUsed"
          description: Forbidden - search access not available for this account, or a requested field is not enabled on it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                endpoint_not_enabled:
                  summary: The account is not entitled to this endpoint
                  value:
                    error:
                      type: permission_error
                      message: You do not have permission to access /company/search.
                      metadata: []
                fields_denied:
                  summary: A requested field is not enabled on the account
                  value:
                    error:
                      type: permission_error
                      message: "Access denied to fields: funding. To enable access, please book a call with us at https://meetings-na2.hubspot.com/chris-pisarski/web-demo-request"
                      metadata:
                        - denied_fields:
                            - funding
                          permitted_fields:
                            - basic_info
                            - headcount
                            - locations
        "500":
          headers:
            X-Credits-Used:
              $ref: "#/components/headers/XCreditsUsed"
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    ApiVersion:
      name: x-api-version
      in: header
      required: true
      schema:
        type: string
        enum:
          - 2025-11-01
        default: 2025-11-01
        example: 2025-11-01
      description: API version to use. This endpoint currently requires `2025-11-01`.
  schemas:
    CompanyIdentifyRequest:
      type: object
      description: Company identifiers plus optional field selection and exact_match. Provide exactly one identifier type (names, domains, crustdata_company_ids, or professional_network_profile_urls); each may contain 1 to 25 values.
      properties:
        names:
          type: array
          items:
            type: string
          maxItems: 25
          nullable: true
        domains:
          type: array
          items:
            type: string
          maxItems: 25
          nullable: true
        crustdata_company_ids:
          type: array
          items:
            type: integer
          maxItems: 25
          nullable: true
        professional_network_profile_urls:
          type: array
          items:
            type: string
          maxItems: 25
          nullable: true
        fields:
          type: array
          items:
            type: string
          description: |
            Field groups to include in `company_data`. Valid field groups: `crustdata_company_id`, `basic_info`, `social_profiles`. Identify resolves a company to its identity and basic profile only; requesting any other group returns `400 Invalid fields`. For `headcount`, `funding`, `people`, `hiring`, `revenue` and other sections, use `/company/enrich`.
        exact_match:
          type: boolean
          nullable: true
          description: Whether to use exact matching (null means auto-detect)
      oneOf:
        - required:
            - names
        - required:
            - domains
        - required:
            - crustdata_company_ids
        - required:
            - professional_network_profile_urls
      example:
        domains:
          - serverobotics.com
        fields:
          - basic_info
          - social_profiles
    CompanyIdentifyResponse:
      type: array
      description: Top-level array returned by /company/identify with one entry per submitted identifier.
      items:
        $ref: "#/components/schemas/IdentifyResult"
      example:
        - matched_on: mintlify.com
          match_type: domain
          matches: []
    ErrorResponse:
      type: object
      description: Standard error response returned by all endpoints for 4xx and 5xx errors.
      required:
        - error
      properties:
        error:
          type: object
          description: Error details
          required:
            - type
            - message
          properties:
            type:
              type: string
              enum:
                - invalid_request
                - authentication_error
                - unauthorized
                - insufficient_credits
                - permission_error
                - rate_limit_error
                - internal_error
              description: Category of the error
              example: invalid_request
            message:
              type: string
              description: Human-readable error message
              example: "Exactly one identifier must be provided: crustdata_company_ids, names, domains, or professional_network_profile_urls"
            metadata:
              type: array
              items:
                type: object
                additionalProperties: true
              default: []
              description: Additional structured context (e.g., list of available fields)
    IdentifyResult:
      type: object
      properties:
        matched_on:
          type: string
          description: The specific input value (e.g., 'google.com')
        match_type:
          type: string
          enum:
            - name
            - domain
            - crustdata_company_id
            - professional_network_profile_url
        matches:
          type: array
          items:
            $ref: "#/components/schemas/IdentifyMatch"
      description: One result entry in the identify response — one per submitted identifier.
      example:
        matched_on: mintlify.com
        match_type: domain
        matches:
          - confidence_score: 1
            company_data:
              crustdata_company_id: 810670
              basic_info:
                name: Mintlify
                primary_domain: mintlify.link
    IdentifyMatch:
      type: object
      properties:
        confidence_score:
          type: number
          format: float
          example: 0.95
        company_data:
          $ref: "#/components/schemas/CompanyIdentify"
      description: A single company match from /company/identify with confidence score and core company data.
      example:
        confidence_score: 1
        company_data:
          crustdata_company_id: 810670
          basic_info:
            name: Mintlify
            primary_domain: mintlify.link
    CompanyIdentify:
      type: object
      additionalProperties: false
      properties:
        crustdata_company_id:
          type: integer
        basic_info:
          type: object
          properties:
            crustdata_company_id:
              type: integer
              example: 810670
            name:
              type: string
              nullable: true
              example: Mintlify
            primary_domain:
              type: string
              nullable: true
              example: mintlify.link
            all_domains:
              type: array
              items:
                type: string
              nullable: true
              example:
                - mintlify.com
                - mintlify.link
            website:
              type: string
              nullable: true
              example: https://mintlify.link/li
            professional_network_url:
              type: string
              nullable: true
              example: https://www.linkedin.com/company/mintlify
            professional_network_id:
              type: string
              nullable: true
              example: "79912175"
            profile_name:
              type: string
              nullable: true
              example: Mintlify
            logo_permalink:
              type: string
              nullable: true
              example: https://crustdata-media.s3.us-east-2.amazonaws.com/company/abc.jpg
            description:
              type: string
              nullable: true
              example: On a mission to empower millions of developers.
            company_type:
              type: string
              nullable: true
              example: Privately Held
            year_founded:
              type: integer
              nullable: true
              example: 2022
            employee_count_range:
              type: string
              nullable: true
              example: 51-200
            markets:
              type: array
              items:
                type: string
              nullable: true
              example:
                - PRIVATE
            industries:
              type: array
              items:
                type: string
              nullable: true
              example:
                - Software Development
                - Technology, Information and Internet
        social_profiles:
          type: object
          properties:
            professional_network:
              type: string
              nullable: true
              description: |
                Profile URL for the company. Same value also surfaced at basic_info.professional_network_url.
      description: Basic company fields returned inside identify matches.
      example:
        crustdata_company_id: 810670
        basic_info:
          name: Mintlify
          primary_domain: mintlify.link
    CompanyEnrichRequest:
      type: object
      description: Company identifiers plus optional field selection and exact_match. Provide exactly one identifier type (names, domains, crustdata_company_ids, or professional_network_profile_urls); each may contain one or more values.
      properties:
        names:
          type: array
          items:
            type: string
          nullable: true
        domains:
          type: array
          items:
            type: string
          nullable: true
        crustdata_company_ids:
          type: array
          items:
            type: integer
          nullable: true
        professional_network_profile_urls:
          type: array
          items:
            type: string
          nullable: true
        fields:
          type: array
          items:
            type: string
          description: |
            Field groups to include in `company_data`. When `fields` is omitted, only `crustdata_company_id` and `basic_info` are returned — sections such as `headcount`, `funding`, `people`, and `hiring` must be listed explicitly. Valid field groups for enrich: basic_info, revenue, headcount, funding, hiring, web_traffic, seo, competitors, employee_reviews, people, locations, taxonomy, followers, news, software_reviews, social_profiles, reviews, public_launches, market_intel, metadata, crustdata_company_id, updated_at, indexed_at. Also available: social_posts, which is never returned by default and must be requested explicitly. Not valid for enrich: roles, skills (search-only fields).
        exact_match:
          type: boolean
          nullable: true
          description: Whether to use exact matching (null means auto-detect)
      oneOf:
        - required:
            - names
        - required:
            - domains
        - required:
            - crustdata_company_ids
        - required:
            - professional_network_profile_urls
      example:
        domains:
          - serverobotics.com
        fields:
          - basic_info
          - headcount
          - funding
    CompanyEnrichResponse:
      type: array
      description: Top-level array returned by /company/enrich with one entry per submitted identifier.
      items:
        $ref: "#/components/schemas/EnrichResult"
      example:
        - matched_on: mintlify.com
          match_type: domain
          matches: []
    EnrichResult:
      type: object
      properties:
        matched_on:
          type: string
          description: The specific input value (e.g., 'google.com')
        match_type:
          type: string
          enum:
            - name
            - domain
            - crustdata_company_id
            - professional_network_profile_url
        matches:
          type: array
          items:
            $ref: "#/components/schemas/EnrichMatch"
      description: One result entry in the enrich response — one per submitted identifier.
      example:
        matched_on: mintlify.com
        match_type: domain
        matches:
          - confidence_score: 1
            company_data:
              crustdata_company_id: 810670
              basic_info:
                name: Mintlify
                primary_domain: mintlify.link
    EnrichMatch:
      type: object
      properties:
        confidence_score:
          type: number
          format: float
          example: 0.95
        company_data:
          $ref: "#/components/schemas/CompanyEnrich"
      description: A single enriched company match from /company/enrich with confidence score and full company data.
      example:
        confidence_score: 1
        company_data:
          crustdata_company_id: 810670
          basic_info:
            name: Mintlify
            primary_domain: mintlify.link
    CompanyEnrich:
      type: object
      additionalProperties: false
      properties:
        crustdata_company_id:
          type: integer
        updated_at:
          type: string
          format: date-time
          nullable: true
        indexed_at:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          properties:
            growth_calculation_date:
              type: string
              nullable: true
        basic_info:
          type: object
          properties:
            crustdata_company_id:
              type: integer
              example: 810670
            name:
              type: string
              nullable: true
              example: Mintlify
            primary_domain:
              type: string
              nullable: true
              example: mintlify.link
            all_domains:
              type: array
              items:
                type: string
              nullable: true
              example:
                - mintlify.com
                - mintlify.link
            website:
              type: string
              nullable: true
              example: https://mintlify.link/li
            professional_network_url:
              type: string
              nullable: true
              example: https://www.linkedin.com/company/mintlify
            professional_network_id:
              type: string
              nullable: true
              example: "79912175"
            profile_name:
              type: string
              nullable: true
              example: Mintlify
            logo_permalink:
              type: string
              nullable: true
              example: https://crustdata-media.s3.us-east-2.amazonaws.com/company/abc.jpg
            description:
              type: string
              nullable: true
              example: On a mission to empower millions of developers.
            company_type:
              type: string
              nullable: true
              example: Privately Held
            status:
              type: string
              nullable: true
              description: Company lifecycle in Crustdata's entity graph. `active` is a live company record; `deleted` is one Crustdata has retired. The person APIs return the same value as `company_status` on an employment record.
              example: active
            year_founded:
              type: integer
              nullable: true
              example: 2022
            employee_count_range:
              type: string
              nullable: true
              example: 51-200
            markets:
              type: array
              items:
                type: string
              nullable: true
              example:
                - PRIVATE
        revenue:
          type: object
          properties:
            estimated:
              type: object
              properties:
                lower_bound_usd:
                  type: integer
                upper_bound_usd:
                  type: integer
                timeseries:
                  type: array
                  items:
                    type: object
            public_markets:
              type: object
              properties:
                ipo_date:
                  type: string
                  format: date
                stock_symbols:
                  type: array
                  items:
                    type: string
                fiscal_year_end:
                  type: string
            acquisition_status:
              type: string
              nullable: true
        headcount:
          type: object
          description: Employee footprint
          properties:
            total:
              type: integer
              nullable: true
            largest_headcount_country:
              type: string
              nullable: true
            timeseries:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                  employee_count:
                    type: integer
              nullable: true
            growth_percent:
              type: object
              description: |
                Headcount growth percent by period. Keys are period aliases: `mom` (month-over-month), `qoq` (quarter-over-quarter), `six_months`, `yoy` (year-over-year), `two_years`. Values are percentage changes over the trailing window.

                <Note>
                    `/company/search` returns the same growth data under different period keys (`1m`, `3m`, `6m`, `12m`) and exposes per-period filtering via `headcount.growth_percent.{1m,3m,6m,12m}` paths.
                </Note>
              additionalProperties:
                type: number
                nullable: true
              example:
                mom: 0.67
                qoq: 2.69
                six_months: 5.5
                yoy: 12.63
                two_years: 32.5
            growth_absolute:
              type: object
              description: |
                Headcount absolute change by period. Keys are period aliases: `mom`, `qoq`, `six_months`, `yoy`, `two_years`. Values are absolute employee-count deltas over the trailing window.
              additionalProperties:
                type: integer
                nullable: true
              example:
                mom: 81
                qoq: 318
                six_months: 634
                yoy: 1363
                two_years: 2982
            by_role_absolute:
              type: object
              additionalProperties:
                type: integer
                nullable: true
            by_role_percent:
              type: object
              additionalProperties:
                type: number
                nullable: true
            by_region_absolute:
              type: object
              additionalProperties:
                type: integer
                nullable: true
            by_region_percent:
              type: object
              additionalProperties:
                type: number
                nullable: true
            by_skill_absolute:
              type: object
              additionalProperties:
                type: integer
                nullable: true
