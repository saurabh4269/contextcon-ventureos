    CompanySearchRequest:
      type: object
      additionalProperties: false
      properties:
        filters:
          description: Search filters. Required when `search` is omitted. When combined with ranked search, filters are hard constraints applied before retrieval.
          example:
            field: basic_info.primary_domain
            type: =
            value: hubspot.com
          oneOf:
            - $ref: "#/components/schemas/SearchCondition"
            - $ref: "#/components/schemas/SearchConditionGroup"
        search:
          $ref: "#/components/schemas/CompanySemanticSearch"
        cursor:
          type: string
          description: Pagination cursor from the previous response's `next_cursor`. For ranked search, keep query, mode, filters and API version unchanged; limit and authorized fields may change. Cursors expire 20 minutes after the initial ranked search. Restart without cursor if the cursor or cached search is no longer valid.
          example: H4sIAJj5zGkC_xXMMQ7CMAxA0...
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
          description: Results per page. The maximum is 1000 for filter-only search and 100 for ranked search. Ranked search covers at most 1000 candidate positions across pages.
        sorts:
          type: array
          description: Sort directives applied to filter-only results. Not supported with ranked search.
          example:
            - field: headcount.total
              order: desc
          items:
            $ref: "#/components/schemas/SearchSort"
        fields:
          type: array
          description: |
            Fields to return in the response. Use dot-notation for nested fields (e.g., "basic_info.name", "headcount.total"). Each company always includes `crustdata_company_id`, even when you do not request it. Every requested field is in the response, and a field with no data for the company is `null`. When a requested group has no data, the whole group is `null`, even if you asked for one of its sub-fields. Valid top-level groups for search: basic_info, revenue, headcount, funding, hiring, locations, taxonomy, followers, social_profiles, software_reviews, metadata, updated_at, indexed_at, crustdata_company_id. Some groups are filter-only and cannot be selected here (for example roles, skills, seo, competitors), and groups not in the search index (for example news, people, web_traffic, employee_reviews) are rejected. Use /company/enrich for those.
          example:
            - basic_info
            - headcount
            - funding
          items:
            type: string
      description: Request body for searching the company database. Supply at least one of `filters` or `search`.
      example:
        filters:
          field: basic_info.primary_domain
          type: =
          value: hubspot.com
        fields:
          - basic_info
          - headcount
          - funding
        limit: 1
    CompanySearchResponse:
      type: object
      properties:
        companies:
          type: array
          items:
            $ref: "#/components/schemas/CompanySearch"
        next_cursor:
          type: string
          nullable: true
          description: Pass as cursor to continue. A ranked page can be short or empty with a non-null cursor; continue until null.
        total_count:
          type: integer
          nullable: true
          description: Always null for ranked search. Filter-only totals may also be unavailable.
        query:
          type: object
          additionalProperties: true
      required:
        - companies
      description: Paginated response from the /company/search endpoint.
      example:
        companies: []
        next_cursor: null
        total_count: 0
