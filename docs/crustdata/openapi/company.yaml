            public_markets:
              type: object
              properties:
                ipo_date:
                  type: string
                  format: date
                  nullable: true
                stock_symbols:
                  type: array
                  items:
                    type: string
                  nullable: true
                fiscal_year_end:
                  type: string
                  nullable: true
            acquisition_status:
              type: string
              nullable: true
        headcount:
          type: object
          description: Employee footprint
          properties:
            total:
              type: integer
              nullable: true
            largest_headcount_country:
              type: string
              nullable: true
            growth_percent:
              type: object
              description: |
                Headcount growth percent by period. Keys are period suffixes (`1m`, `3m`, `6m`, `12m`); values are percentage changes over the trailing window. Each period is also filterable via `headcount.growth_percent.{period}` on `/company/search`.
              additionalProperties:
                type: number
                nullable: true
              example:
                1m: 0.67
                3m: 2.69
                6m: 5.5
                12m: 12.63
            growth_absolute:
              type: object
              description: |
                Headcount absolute change by period. Keys are period suffixes (`1m`, `3m`, `6m`, `12m`); values are absolute employee-count deltas over the trailing window. Each period is also filterable via `headcount.growth_absolute.{period}` on `/company/search`.
              additionalProperties:
                type: integer
                nullable: true
              example:
                1m: 81
                3m: 318
                6m: 634
                12m: 1363
        software_reviews:
          type: object
          properties:
            review_count:
              type: integer
              nullable: true
            average_rating:
              type: number
              nullable: true
            review_count_mom_pct:
              type: number
              nullable: true
            review_count_qoq_pct:
              type: number
              nullable: true
            review_count_yoy_pct:
              type: number
              nullable: true
        funding:
          type: object
          properties:
            total_investment_usd:
              type: number
              nullable: true
            last_round_amount_usd:
              type: number
              nullable: true
            last_fundraise_date:
              type: string
              format: date
              nullable: true
            last_round_type:
              type: string
              nullable: true
              example: series_a
            investors:
              type: array
              items:
                type: string
              nullable: true
        hiring:
          type: object
          properties:
            openings_count:
              type: integer
            openings_growth_percent:
              type: object
              additionalProperties:
                type: number
                nullable: true
            by_function_qoq_pct:
              type: object
              additionalProperties:
                type: number
                nullable: true
            by_function_6m_pct:
              type: object
              additionalProperties:
                type: number
                nullable: true
        locations:
          type: object
          properties:
            country:
              type: string
              nullable: true
              description: |
                Headquarters country as a full country name. Filter with the name or an
                ISO 3166-1 alpha-3 code, such as `USA`. Both forms return the same companies.
              example: United States
            headquarters:
              type: string
              nullable: true
            street_address:
              type: string
              nullable: true
              description: HQ street address (e.g. "510 Townsend St.")
            state:
              type: string
              nullable: true
            all_office_addresses:
              type: array
              items:
                type: string
              nullable: true
        social_profiles:
          type: object
          properties:
            crunchbase:
              type: object
              properties:
                url:
                  type: string
                  nullable: true
                uuid:
                  type: string
                  nullable: true
            twitter_url:
              type: string
              nullable: true
            professional_network:
              type: string
              nullable: true
              description: |
                Profile URL for the company. Same value also surfaced at basic_info.professional_network_url.
        taxonomy:
          type: object
          properties:
            professional_network_specialities:
              type: array
              items:
                type: string
              nullable: true
            professional_network_industry:
              type: string
              nullable: true
            professional_network_industries:
              type: array
              items:
                type: string
              nullable: true
            categories:
              type: array
              items:
                type: string
              nullable: true
            primary_naics_detail:
              type: object
              nullable: true
              description: |
                Primary NAICS classification: the six-digit code and the sector, sub-sector, and industry-group levels above it. `null` when the company has no NAICS code. Every leaf is also a filter path under `taxonomy.primary_naics_detail.*`. Returned as part of the `taxonomy` group at no extra charge.
              properties:
                naics_code:
                  type: string
                  nullable: true
                  description: Six-digit NAICS code, for example "541511".
                sector:
                  type: string
                  nullable: true
                  description: NAICS sector, the two-digit level.
                sub_sector:
                  type: string
                  nullable: true
                  description: NAICS sub-sector, the three-digit level.
                industry_group:
                  type: string
                  nullable: true
                  description: NAICS industry group, the four-digit level.
                industry:
                  type: string
                  nullable: true
                  description: NAICS industry title, the six-digit level.
                year:
                  type: integer
                  nullable: true
                  description: NAICS edition year the code belongs to. Filterable, not sortable.
            sic_detail_list:
              type: array
              nullable: true
              description: |
                SIC codes assigned to the company, one entry per code. `null` when the company has none. Every leaf is also a filter path under `taxonomy.sic_detail_list.*`. Two `sic_code` conditions under `and` match a company whose list holds both codes. Returned as part of the `taxonomy` group at no extra charge.
              items:
                type: object
                properties:
                  sic_code:
                    type: string
                    nullable: true
                    description: Four-digit SIC code, for example "7372".
                  industry:
                    type: string
                    nullable: true
                    description: SIC industry title for the code.
                  year:
                    type: integer
                    nullable: true
                    description: SIC edition year the code belongs to. Filterable, not sortable.
        followers:
          type: object
          properties:
            count:
              type: integer
              default: 0
              nullable: true
            mom_percent:
              type: number
              default: 0
              nullable: true
            qoq_percent:
              type: number
              default: 0
              nullable: true
            six_months_growth_percent:
              type: number
              default: 0
              nullable: true
            yoy_percent:
              type: number
              default: 0
              nullable: true
      description: A company profile returned by the /company/search endpoint. Only indexed fields are populated.
      example:
        crustdata_company_id: 68529
        basic_info:
          name: HubSpot
          primary_domain: hubspot.com
        headcount:
          total: 11965
  headers:
    XCreditsUsed:
      description: Exact credits this request deducted, as a decimal string (for example `3` or `0.03`). Present on success and error responses alike; `0` when the request deducted nothing (free endpoints, error responses, and asynchronous job submissions billed when the job runs). Responses generated before a request reaches the API, such as rate-limit `429`s, do not carry it.
      schema:
        type: string
        example: "0.03"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key passed as a Bearer token in the Authorization header.
