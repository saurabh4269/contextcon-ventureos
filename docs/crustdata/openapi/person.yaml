    PersonSearchRemark:
      type: object
      description: One note on a search result. `code`, `path`, `matches_without` and the `resolution` fields `field`, `value` and `matches_with` are stable. `message`, `hint` and `resolution.companies[].name` are free text and may change without notice.
      additionalProperties: true
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - condition_eliminates_all
            - no_single_culprit
          description: "`condition_eliminates_all`: the condition at `path` removes every result. `no_single_culprit`: no probed condition explains the empty result on its own. Later features extend this list with the codes they emit."
          example: condition_eliminates_all
        path:
          type: string
          description: "Where in the request as sent the remark applies: `filters` when the whole filter is one condition, `filters.conditions[i]` for the i-th condition of the top-level `and`. Absent on `no_single_culprit`."
          example: filters.conditions[2]
        message:
          type: string
          example: experience.employment_details.current.title in [9 values] removes every result (22 match without it).
        matches_without:
          type: integer
          description: Profiles the search returns with the condition at `path` removed.
          example: 22
        hint:
          type: string
          description: A next step, when one is known.
          example: "'in' on title matches the whole stored string, not words inside it. Replace it with an or group of [.] leaves, one value each, for a phrase match; or remove it (and the group holding it, if it holds nothing else) and rank the remaining scope by meaning: add \"search\": {\"query\": \"Geschäftsführer\"} and top-level \"mode\": \"exact\" (drop \"sorts\")."
        resolution:
          type: object
          description: "On `condition_eliminates_all` for a company name or website domain condition, when the value resolves to company records that recover profiles: the `company_id` filter to send instead. The result you received is unchanged."
          required:
            - field
            - value
            - companies
            - matches_with
          properties:
            field:
              type: string
              description: The `company_id` filter path for the condition's scope.
              example: experience.employment_details.current.company_id
            value:
              type: array
              items:
                type: integer
              description: The company ids that are the same company as the value you sent.
              example:
                - 631360
            companies:
              type: array
              items:
                type: object
                required:
                  - company_id
                  - name
                properties:
                  company_id:
                    type: integer
                    example: 631360
                  name:
                    type: string
                    example: Rubrik
            matches_with:
              type: integer
              description: Profiles the search returns with `field in value` OR-ed onto the condition at `path`, the rest of the request unchanged.
              example: 4804
