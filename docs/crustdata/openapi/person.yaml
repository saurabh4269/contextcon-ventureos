openapi: 3.0.3
info:
  title: Person Dataset API
  version: 2025-11-01
  description: |
    The Person Dataset API provides a comprehensive suite of endpoints for discovering, enriching, and managing person data at scale.

    - **Search**: Query the person database using flexible filters, sorting, and pagination to find people matching specific criteria such as job title, company, location, and more.
    - **Enrich**: Enrich person records from the cached dataset using profile URLs, returning detailed professional information.
    - **Live Enrich**: Fetch fresh profile data from the web when a profile is not yet in the cache or when the latest data is needed.
    - **Autocomplete**: Get type-ahead suggestions for person search fields, useful for building search UIs with field value previews.
    - **Realtime Search**: Search people in real time using live person search filters, supporting both synchronous and asynchronous (background job) modes.
servers:
  - url: https://api.crustdata.com
    description: Production API server
security:
  - bearerAuth: []
paths:
  /person/search:
    post:
      tags:
        - Person APIs
        - Search APIs
      summary: Search people using filters and sorting
      description: |
        Search the Crustdata person database using flexible filter conditions, sorting, and cursor-based pagination.
        Supports filtering on hundreds of fields including job title, company, location, seniority, industry, education, and more.
        Use compound conditions with AND/OR logic to build complex queries. Results can be sorted and paginated using cursors.

        Pricing: 0.03 credits per result, plus a per-result charge for each premium group you filter on or receive (experience, education and skills 0.1; certifications, honors, professional network signals, languages and summary 0.2; dev platform profile filters 0.8 or 2.5, filter side only). Filtering and receiving bill independently and sorting is free. A request with no `fields` returns experience and education, which costs 0.23 per result on the standard plan. Your account's prices are on /account/endpoints.

        <Note>
            Default `rate-limit` is 30 requests per minute. Send an email to [gtm@crustdata.co](mailto:gtm@crustdata.co) to discuss higher limits if needed for your use case.
        </Note>
      operationId: searchPersonDataset
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        description: Search filters, sorting, pagination, and field selection options.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonSearchRequest"
            examples:
              search_by_title:
                summary: Search by current job title
                value:
                  filters:
                    field: experience.employment_details.current.title
                    type: =
                    value: CEO
                  limit: 1
              search_cto_midsize:
                summary: Search CTOs at mid-size companies
                value:
                  filters:
                    op: and
                    conditions:
                      - field: experience.employment_details.current.title
                        type: =
                        value: CTO
                      - field: experience.employment_details.current.company_headcount_range
                        type: in
                        value:
                          - 51-200
                          - 201-500
                  limit: 2
              search_by_person_id:
                summary: Look up a person by Crustdata ID — shows normalized_title and education location/logo
                value:
                  filters:
                    field: crustdata_person_id
                    type: =
                    value: 14540
                  fields:
                    - basic_profile
                    - education
                  limit: 1
              search_by_research_citations:
                summary: Researchers with an h-index above 100, most cited first (`research_profiles` is enabled per account)
                value:
                  filters:
                    field: research_profiles.h_index.all
                    type: ">"
                    value: 100
                  sorts:
                    - field: research_profiles.citations_count.all
                      order: desc
                  fields:
                    - basic_profile.name
                    - research_profiles.name
                    - research_profiles.citations_count.all
                  limit: 2
      responses:
        "200":
          headers:
            X-Credits-Used:
              $ref: "#/components/headers/XCreditsUsed"
          description: People matching the search criteria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonSearchResponse"
              examples:
                search_by_title_response:
                  summary: Search results for CEO title (paired with `search_by_title` request)
                  value:
                    profiles:
                      - crustdata_person_id: 963
                        basic_profile:
                          name: Nithin Kamath
                        experience:
                          employment_details:
                            current:
                              - title: CEO
                              - title: Founder & CEO
                    next_cursor: H4sIACIdzWkC...
                    total_count: 1105055
                search_cto_midsize_response:
                  summary: CTOs at mid-size companies (paired with `search_cto_midsize` request)
                  value:
                    profiles:
                      - crustdata_person_id: 985
                        basic_profile:
                          name: Vikram Shah
                        experience:
                          employment_details:
                            current:
                              - title: CTO
                              - title: Co-founder
                      - crustdata_person_id: 1171
                        basic_profile:
                          name: Jagdeep Singh
                        experience:
                          employment_details:
                            current:
                              - title: Director Of Technical Operations
                              - title: CTO
                    next_cursor: H4sIAAA-3mkC...
                    total_count: 9176
                search_by_person_id_response:
                  summary: Profile for crustdata_person_id 14540 (paired with `search_by_person_id` request)
                  value:
                    profiles:
                      - crustdata_person_id: 14540
                        basic_profile:
                          name: David Hsu
                          current_title: Founder, CEO
                          normalized_title:
                            matched_title: Co-Founder, CEO, CTO
                            department: Executive Leadership
                            sub_department: Founder & Entrepreneurship Leadership
                            similarity: 0.6012
                            confident: true
                        education:
                          schools:
                            - school: University of Oxford
                              degree: Bachelor of Arts (B.A.)
                              location:
                                raw: Oxford, England
                                city: Oxford
                                state: England
                                country: United Kingdom
                                continent: null
                              institute_logo_permalink: https://crustdata-media.s3.us-east-2.amazonaws.com/company/3d2093a16f7cf7b459a0d30d4e795d0be5a41a3396f21dee899e43e8a8b6de8d.jpg
                    next_cursor: H4sIACIdzWkC...
                    total_count: 1
                search_by_research_citations_response:
                  summary: Most-cited researchers with an h-index above 100 (paired with `search_by_research_citations` request)
                  value:
                    profiles:
                      - crustdata_person_id: 4550955
                        basic_profile:
                          name: Yoshua Bengio
                        research_profiles:
                          - name: Yoshua Bengio
                            citations_count:
                              all: 1153498
                      - crustdata_person_id: 282824395
                        basic_profile:
                          name: Ahmedin Jemal
                        research_profiles:
                          - name: Ahmedin Jemal
                            citations_count:
                              all: 1010816
                    next_cursor: H4sIAG67x2oC...
                    total_count: 7860
                    total_count_relation: null
                    remarks: []
        "400":
          headers:
            X-Credits-Used:
              $ref: "#/components/headers/XCreditsUsed"
          description: Invalid search request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_field:
                  summary: Unsupported filter field
                  value:
                    error:
                      type: invalid_request
                      message: "Unsupported filter field: 'current_title'. Supported fields: ['basic_profile.name', 'basic_profile.headline', ...]"
                      metadata: []
                count_limit_conflict:
                  summary: Both count and limit supplied
                  value:
                    error:
                      type: invalid_request
                      message: Only one of 'count' or 'limit' can be provided, not both
                      metadata: []
        "401":
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  type: unauthorized
                  message: Invalid API key in request.
                  metadata: []
        "403":
          headers:
            X-Credits-Used:
              $ref: "#/components/headers/XCreditsUsed"
          description: Forbidden - search access not available for this account, or a requested field is not enabled on it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                endpoint_not_enabled:
                  summary: The account is not entitled to this endpoint
                  value:
                    error:
                      type: permission_error
                      message: You do not have permission to access /person/search.
                      metadata: []
                fields_denied:
                  summary: A requested field is not enabled on the account
                  value:
                    error:
                      type: permission_error
                      message: "Access denied to fields: contact. To enable access, please book a call with us at https://meetings-na2.hubspot.com/chris-pisarski/web-demo-request"
                      metadata:
                        - denied_fields:
                            - contact
                          permitted_fields:
                            - basic_profile
                            - education
                            - experience
                research_profiles_denied:
                  summary: research_profiles is not enabled on the account
                  value:
                    error:
                      type: permission_error
                      message: "Access denied to fields: research_profiles. To enable access, please book a call with us at https://meetings-na2.hubspot.com/chris-pisarski/web-demo-request"
                      metadata:
                        - denied_fields:
                            - research_profiles
                          permitted_fields:
                            - basic_profile
                            - education
                            - experience
        "500":
          headers:
            X-Credits-Used:
              $ref: "#/components/headers/XCreditsUsed"
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /person/enrich:
    post:
      tags:
        - Person APIs
        - Enrich APIs
      summary: Enrich person profiles from cached dataset
      description: |
        Enrich person records using the Crustdata cached dataset. Provide profile URLs to retrieve detailed
        person data including employment history, education, skills, and developer platform data when available.
        Supports batch enrichment of up to 25 profiles at once.
        <Note>
            Default `rate-limit` is 15 requests per minute. Contact support to discuss higher limits if needed for your use case.
        </Note>
      operationId: enrichPersonDataset
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        description: Profile URLs and optional field selection.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonEnrichRequest"
            examples:
              default_fields:
                summary: Enrich a profile with the default fields
                value:
                  professional_network_profile_urls:
                    - https://www.linkedin.com/in/dvdhsu/
              selected_fields:
                summary: Enrich a profile with employment and education data
                value:
                  professional_network_profile_urls:
                    - https://www.linkedin.com/in/dvdhsu/
                  fields:
                    - basic_profile
                    - experience
                    - education
              research_profiles:
                summary: Enrich a profile with its research profiles (enabled per account)
                value:
                  professional_network_profile_urls:
                    - https://www.linkedin.com/in/yann-lecun/
                  fields:
                    - basic_profile.name
                    - research_profiles
      responses:
        "200":
          headers:
            X-Credits-Used:
              $ref: "#/components/headers/XCreditsUsed"
          description: Enriched person profiles
          content:
