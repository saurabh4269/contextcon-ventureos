          type: object
          nullable: true
          properties:
            last_scraped_source:
              type: string
              format: date-time
              nullable: true
              description: When the profile was last refreshed from the web.
              example: 2026-09-09T07:39:01.451002Z
    PersonAssessment:
      type: object
      nullable: true
      properties:
        authenticity:
          type: object
          nullable: true
          properties:
            verdict:
              type: string
              nullable: true
              enum:
                - clearly_genuine
                - probably_genuine
                - cannot_verify
                - probably_fabricated
                - clearly_fabricated
              description: Authenticity label for the profile. `cannot_verify` means thin evidence rather than fraud, and `probably_fabricated` is a review flag, not a trigger for automated action.
            tier:
              type: integer
              nullable: true
              minimum: 0
              maximum: 9
              description: Authenticity tier, 0 (most trusted) to 9 (least trusted). Sortable on /person/search, where ascending puts the most trusted first.
          description: Authenticity assessment of the profile.
      description: "Computed profile assessment. Returned only by /person/enrich, never by default, and not a billed add-on. `verdict` and `tier` are populated independently, so a profile may carry a tier with a null verdict. Filterable and sortable on /person/search, but not returnable there: naming an assessment path in that endpoint's `fields` returns 400 Invalid fields."
      example:
        authenticity:
          verdict: probably_genuine
          tier: 2
    PersonEmploymentDetails:
      allOf:
        - $ref: "#/components/schemas/PersonSearchEmploymentDetails"
        - type: object
          properties:
            company_website_domain:
              type: string
              nullable: true
    PersonEducation:
      allOf:
        - $ref: "#/components/schemas/PersonSearchEducation"
        - type: object
          properties:
            activities_and_societies:
              type: string
              nullable: true
              description: Activities and societies the person participated in.
              example: Debating Society
    SocialPostHyperlinks:
      type: object
      nullable: true
      properties:
        company_professional_network_urls:
          type: array
          nullable: true
          items:
            type: string
          description: Company page URLs mentioned in the post.
        person_professional_network_urls:
          type: array
          nullable: true
          items:
            type: string
          description: Person profile URLs mentioned in the post.
        other_urls:
          type: array
          nullable: true
          items:
            type: string
          description: Other URLs mentioned in the post.
        media_urls:
          type: array
          nullable: true
          items:
            type: string
          description: Image and video attachment URLs.
      description: URLs extracted from the post body.
    SocialPostEngagement:
      type: object
      nullable: true
      properties:
        total_reactions:
          type: integer
          nullable: true
        total_comments:
          type: integer
          nullable: true
        num_shares:
          type: integer
          nullable: true
        reactions_by_type:
          $ref: "#/components/schemas/SocialPostReactionsByType"
      description: Post-level engagement counts.
      example:
        total_reactions: 142
        total_comments: 9
        num_shares: 3
    PersonResearchProfileCitationYear:
      type: object
      description: Citations received in one calendar year.
      properties:
        year:
          type: integer
          nullable: true
          example: 2015
        citations:
          type: integer
          nullable: true
          example: 13241
    PersonResearchProfileArticle:
      type: object
      description: One publication listed on the research profile.
      properties:
        title:
          type: string
          nullable: true
          example: Deep learning
        url:
          type: string
          nullable: true
          description: Citation page of the publication.
        publication_year:
          type: string
          nullable: true
          description: Year of publication, as a string.
          example: "2015"
        total_citations:
          type: integer
          nullable: true
          example: 122610
        authors:
          type: array
          nullable: true
          items:
            type: string
          description: Author names as listed on the publication.
        all_authors:
          type: boolean
          nullable: true
          description: False when the author list was truncated at the source.
        publication:
          type: string
          nullable: true
          description: Venue as displayed, for example journal, volume, and pages.
          example: nature 521 (7553), 436-444
    PersonResearchProfileCoAuthor:
      type: object
      description: A co-author with a research profile linked from this profile.
      properties:
        id:
          type: string
          nullable: true
          description: Research profile identifier of the co-author.
          example: kukA0LcAAAAJ
        profile_url:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
          example: Yoshua Bengio
        designation:
          type: string
          nullable: true
        thumbnail:
          type: string
          nullable: true
    SocialPostReactionsByType:
      type: object
      nullable: true
      properties:
        LIKE:
          type: integer
          nullable: true
        PRAISE:
          type: integer
          nullable: true
        EMPATHY:
          type: integer
          nullable: true
        INTEREST:
          type: integer
          nullable: true
        APPRECIATION:
          type: integer
          nullable: true
        ENTERTAINMENT:
          type: integer
          nullable: true
      description: Reaction counts broken down by type. Only reaction types present on the post are returned.
      example:
        LIKE: 128
        PRAISE: 14
  headers:
    XCreditsUsed:
      description: Exact credits this request deducted, as a decimal string (for example `3` or `0.03`). Present on success and error responses alike; `0` when the request deducted nothing (free endpoints, error responses, and asynchronous job submissions billed when the job runs). Responses generated before a request reaches the API, such as rate-limit `429`s, do not carry it.
      schema:
        type: string
        example: "0.03"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key passed as a Bearer token in the Authorization header.
