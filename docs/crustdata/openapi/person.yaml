    PersonEnrichRequest:
      type: object
      properties:
        professional_network_profile_urls:
          type: array
          items:
            type: string
          description: Array of professional-network profile URLs (max 25).
        fields:
          type: array
          items:
            type: string
          description: |
            Fields to include in the response. Valid field groups for enrich: basic_profile, professional_network, skills, social_handles, experience, education, certifications, honors, dev_platform_profiles, assessment, social_posts, research_profiles. Use dot-notation for nested fields (e.g., "basic_profile.name", "experience.employment_details"). If omitted, a default set (basic_profile, social_handles) is returned. Request additional groups explicitly. Some groups (for example certifications, honors, and research_profiles) require field-level permission on your API key; research_profiles is enabled per account on request and returns `403 Access denied to fields: research_profiles` without the grant.
          example:
            - basic_profile
            - experience
        preview:
          type: boolean
          default: false
          description: Enabled per account on request. Without the grant, the API returns `400 invalid_request` with the message `Preview feature is not available for your account. Please reach out to Crustdata team.` and charges 0 credits. Where enabled, preview mode returns only basic profile fields, charges 0 credits, and ignores `fields`. You cannot combine it with `enrich_realtime`.
      required:
        - professional_network_profile_urls
      additionalProperties: false
      description: Request body for /person/enrich using professional-network profile URLs.
      example:
        professional_network_profile_urls:
          - https://www.linkedin.com/in/dvdhsu/
        fields:
          - basic_profile
    PersonEnrichResponse:
      type: array
      items:
        $ref: "#/components/schemas/PersonEnrichResult"
      description: Response from /person/enrich. Returns a top-level array with one entry per submitted identifier.
      example:
        - matched_on: https://www.linkedin.com/in/dvdhsu/
          match_type: professional_network_profile_url
          matches: []
    PersonEnrichResult:
      type: object
      properties:
        matched_on:
          type: string
          description: The submitted professional-network profile URL.
        match_type:
          type: string
          enum:
            - professional_network_profile_url
        match_status:
          type: string
          enum:
            - matched
            - not_found
            - redacted
          description: "Outcome for this identifier. matched: at least one match. not_found: no profile in Crustdata yet; the identifier is queued for enrichment, so retry later or use live enrich. redacted: the person asked Crustdata to remove their data and the request was approved. A redacted entry always has empty matches, is never billed, and does not change on retry or with live enrich."
        matches:
          type: array
          items:
            $ref: "#/components/schemas/PersonEnrichMatch"
      description: One result entry in the enrich response — one per submitted identifier.
      example:
        matched_on: https://www.linkedin.com/in/dvdhsu/
        match_type: professional_network_profile_url
        matches:
          - confidence_score: 1
            person_data:
              crustdata_person_id: 14540
              basic_profile:
                name: David Hsu
