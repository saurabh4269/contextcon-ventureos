              type: array
              description: |
                Open-to signal codes declared on the profile. Filter with the `in` operator using one or more of the closed enum values below. Human-readable strings like `"open_to_work"` are not indexed and return zero results.

                | Code               | Meaning                                          |
                | ------------------ | ------------------------------------------------ |
