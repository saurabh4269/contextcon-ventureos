components:
  parameters:
    ApiVersion:
      name: x-api-version
      in: header
      required: true
      schema:
        type: string
        enum:
          - 2025-11-01
        default: 2025-11-01
        example: 2025-11-01
      description: API version to use. This endpoint currently requires `2025-11-01`.
  schemas:
    PersonSearchRequest:
      type: object
      additionalProperties: false
      required:
        - filters
      properties:
        filters:
          description: Filter criteria — a single `PersonSearchCondition` or a `PersonSearchConditionGroup` combining conditions with `and`, `or`, or `all_of` (cross-element matching on nested-array fields).
          example:
            field: experience.employment_details.current.title
            type: =
            value: CEO
          oneOf:
            - $ref: "#/components/schemas/PersonSearchCondition"
            - $ref: "#/components/schemas/PersonSearchConditionGroup"
        sorts:
          type: array
          description: Sort directives applied to matched people in order.
          example:
            - field: crustdata_person_id
              order: asc
          items:
            $ref: "#/components/schemas/Sort"
          default: []
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
        count:
          type: integer
          minimum: 1
          maximum: 1000
          description: Alias for limit.
          example: 20
        cursor:
          type: string
          nullable: true
          description: Pagination cursor from a previous response's `next_cursor`. Omit on the first page.
          example: H4sIACIdzWkC...
        post_processing:
          $ref: "#/components/schemas/PostProcessing"
        return_query:
          type: boolean
          default: false
          description: Debug flag - include search query in response
        preview:
          type: boolean
          default: false
          description: Preview mode - return only basic fields for faster response
        explain:
          type: boolean
          default: false
          description: Explain an empty result. When true and a filters-only request returns `total_count` 0, `remarks` names the condition whose removal recovers profiles. Not the `search.explain` flag on semantic search, which returns per-hit scoring.
          example: true
        fields:
          type: array
          description: |
            Optional list of field paths to include in each returned profile. When omitted, a default
            set of profile fields is returned. Use dot notation for a nested field (for example
            `experience.employment_details.current.title`) or a top-level family name (for example
            `basic_profile`) to include the whole family. Each profile always includes
            `crustdata_person_id`, even when you do not request it. A requested field with no data for
            the profile is `null`. An unsupported value returns a `400` whose
            `metadata.available_fields` lists every selectable field. `research_profiles` and its
            sub-paths are enabled per account; without the grant they return `403 Access denied to
            fields: research_profiles`. `skills` is also enabled per account and returns
            `403 Access denied to fields: skills` without access. `certifications`, `honors`,
            `years_of_experience`, `years_of_experience_raw`, and `experience.recently_changed_jobs`
            are enabled per account too, and return `403` with each denied path without access.
            `dev_platform_profiles` is filter-only and returns `400 Invalid fields: dev_platform_profiles`.
          items:
            type: string
          example:
            - basic_profile.name
            - experience.employment_details.current.title
      description: Request body for /person/search. Use filters (optionally grouped with and/or), sorts, limit, and cursor pagination.
      example:
        filters:
          field: experience.employment_details.current.title
          type: =
          value: CEO
        limit: 1
    PersonSearchResponse:
      type: object
      description: Paginated response from the person search endpoint containing matched profiles and pagination metadata.
      properties:
        profiles:
          type: array
          description: Array of person profiles matching the search criteria
          example: []
          items:
            $ref: "#/components/schemas/PersonSearch"
          x-availability:
            - search
          x-cdp-source: spark/models/cpci.py::test
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor string for fetching the next page of results. Pass this value as the cursor parameter in subsequent requests. Null when no more results are available.
          example: H4sIACIdzWkC_xWMMQ7DIAwAv...
          x-availability:
            - search
          x-cdp-source: spark/models/cpci.py::test
        total_count:
          type: integer
          nullable: true
          description: Total number of profiles matching the search criteria across all pages
          example: 1105055
          x-availability:
            - search
          x-cdp-source: spark/models/cpci.py::test
        total_count_relation:
          type: string
          nullable: true
          description: Qualifier for `total_count`, indicating whether it is exact or a lower bound (for example `eq` for an exact count or `gte` when the true total is at least `total_count`). Currently returned as `null`.
          example: null
        remarks:
          type: array
          description: Machine-readable notes on this result. Always present, `[]` when there is nothing to say. Explain remarks appear only when the request set `explain` and the result is empty.
          items:
            $ref: "#/components/schemas/PersonSearchRemark"
          example: []
      required:
        - profiles
        - remarks
      x-cdp-source: spark/models/cpci.py::test
      example:
        profiles: []
        next_cursor: null
        total_count: 0
        total_count_relation: null
        remarks: []
    ErrorResponse:
      type: object
      description: Standard error response returned by all Person API endpoints when a request fails.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - type
            - message
          properties:
            type:
              type: string
              enum:
                - invalid_request
                - authentication_error
                - unauthorized
                - insufficient_credits
                - permission_error
                - rate_limit_error
                - service_unavailable
                - internal_error
              description: Category of the error
              example: invalid_request
            message:
              type: string
              description: Human-readable error message
              example: "Unsupported filter field: 'current_title'"
            metadata:
              type: array
              items:
                type: object
                additionalProperties: true
              default: []
              description: Additional structured context (e.g., available_fields, sortable_fields)
    PersonSearchCondition:
      type: object
      required:
        - field
        - type
        - value
      properties:
        field:
          type: string
          description: |
